# yaml-language-server: $schema=https://json.schemastore.org/github-workflow

name: Arch package

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write # to publish the arch-latest release

concurrency:
  group: arch-package
  cancel-in-progress: true

jobs:
  build:
    if: github.repository == 'stephanlensky/mixxx'
    runs-on: ubuntu-latest
    steps:
      - name: Free disk space
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL
          sudo docker image prune --all --force
          df -h /

      - name: Check out repository
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Restore ccache
        uses: actions/cache/restore@v6
        with:
          path: ${{ runner.temp }}/ccache
          key: arch-ccache-${{ github.sha }}
          restore-keys: arch-ccache-

      - name: Build package
        run: |
          mkdir -p "${{ runner.temp }}/ccache"
          docker run --rm \
            -v "$GITHUB_WORKSPACE:/src" \
            -v "${{ runner.temp }}/ccache:/ccache" \
            -e CCACHE_DIR=/ccache \
            -e CCACHE_MAXSIZE=5G \
            -e MIXXX_OPTIMIZE=portable \
            -e MIXXX_SOURCE=file:///src \
            -e QT_QPA_PLATFORM=offscreen \
            archlinux:base-devel \
            /src/.github/arch/build.sh

      - name: Save ccache
        if: always()
        uses: actions/cache/save@v6
        with:
          path: ${{ runner.temp }}/ccache
          key: arch-ccache-${{ github.sha }}

      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          version="$(cat out/version)"
          gh release delete arch-latest --cleanup-tag --yes || true
          gh release create arch-latest \
            --target "$GITHUB_SHA" \
            --title "Arch package $version" \
            --notes "Built from $GITHUB_SHA" \
            --latest=false \
            out/mixxx-git-x86_64.pkg.tar.zst \
            out/mixxx-git-debug-x86_64.pkg.tar.zst
