# yaml-language-server: $schema=https://json.schemastore.org/github-workflow

name: Arch package

on:
  workflow_dispatch:

permissions:
  contents: read # to fetch code (actions/checkout)

concurrency:
  group: arch-package
  cancel-in-progress: true

jobs:
  build:
    if: github.repository == 'stephanlensky/mixxx'
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Restore ccache
        uses: actions/cache/restore@v6
        with:
          path: ${{ runner.temp }}/ccache
          key: arch-ccache-${{ github.sha }}
          restore-keys: arch-ccache-

      - name: Build package
        run: |
          mkdir -p "${{ runner.temp }}/ccache"
          docker run --rm \
            -v "$GITHUB_WORKSPACE:/src" \
            -v "${{ runner.temp }}/ccache:/ccache" \
            -e CCACHE_DIR=/ccache \
            -e CCACHE_MAXSIZE=5G \
            -e MIXXX_SOURCE=file:///src \
            -e QT_QPA_PLATFORM=offscreen \
            archlinux:base-devel \
            /src/.github/arch/build.sh

      - name: Save ccache
        if: always()
        uses: actions/cache/save@v6
        with:
          path: ${{ runner.temp }}/ccache
          key: arch-ccache-${{ github.sha }}

      - name: Upload packages
        uses: actions/upload-artifact@v7
        with:
          name: arch-package
          path: |
            out/mixxx-git-x86_64.pkg.tar.zst
            out/mixxx-git-debug-x86_64.pkg.tar.zst
          compression-level: 0
          retention-days: 14
